    <rect id="focus-hint-right-margin"  x="12" y="0" width="4" height="16" fill="none" stroke="none"/>

    <style id="current-color-scheme" type="text/css">
        .ColorScheme-Text { color: #e8e4dc; stop-color: #e8e4dc; }
        .ColorScheme-Background { color: #1a1917; stop-color: #1a1917; }
        .ColorScheme-Highlight { color: #ff9d2e; stop-color: #ff9d2e; }
        .ColorScheme-ButtonBackground { color: #22201d; stop-color: #22201d; }
        .ColorScheme-ButtonText { color: #e8e4dc; stop-color: #e8e4dc; }
        .ColorScheme-Frame { color: #22201d; stop-color: #22201d; }
      </style>
  </defs>
