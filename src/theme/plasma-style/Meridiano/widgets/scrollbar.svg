<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="16" height="16" viewBox="0 0 16 16">
  <defs>
    <!-- The slice margins. Plasma only measures them: no fill, no
         border, and their position does not matter. -->
    <rect id="focus-hint-top-margin"    x="0" y="0"              width="16" height="4" fill="none" stroke="none"/>
    <rect id="focus-hint-bottom-margin" x="0" y="12" width="16" height="4" fill="none" stroke="none"/>
    <rect id="focus-hint-left-margin"   x="0" y="0"              width="4" height="16" fill="none" stroke="none"/>
    <rect id="focus-hint-right-margin"  x="12" y="0" width="4" height="16" fill="none" stroke="none"/>
    <rect id="hint-slider-size" x="0" y="0" width="3" height="3" fill="none" stroke="none"/>
    <g id="arrow-up"><rect x="0" y="0" width="1" height="1" fill="none" stroke="none"/></g>

    <style id="current-color-scheme" type="text/css">
        .ColorScheme-Text { color: #e8e4dc; stop-color: #e8e4dc; }
        .ColorScheme-Background { color: #1a1917; stop-color: #1a1917; }
        .ColorScheme-Highlight { color: #ff9d2e; stop-color: #ff9d2e; }
        .ColorScheme-ButtonBackground { color: #22201d; stop-color: #22201d; }
        .ColorScheme-ButtonText { color: #e8e4dc; stop-color: #e8e4dc; }
        .ColorScheme-Frame { color: #22201d; stop-color: #22201d; }
      </style>
  </defs>
<g id="background-vertical"><rect x="0" y="0" width="16" height="3" class="ColorScheme-Text" fill="currentColor" opacity="0.14"/></g>
<g id="background-horizontal"><rect x="0" y="0" width="16" height="3" class="ColorScheme-Text" fill="currentColor" opacity="0.14"/></g>
<g id="slider-vertical"><rect x="0" y="0" width="3" height="16" rx="1" ry="1" class="ColorScheme-Background" fill="currentColor"/></g>
<g id="slider-horizontal"><rect x="0" y="0" width="16" height="3" rx="1" ry="1" class="ColorScheme-Background" fill="currentColor"/></g>
<g id="slider-vertical-hover"><rect x="0" y="0" width="3" height="16" rx="1" ry="1" class="ColorScheme-Highlight" fill="currentColor"/></g>
<g id="slider-horizontal-hover"><rect x="0" y="0" width="16" height="3" rx="1" ry="1" class="ColorScheme-Highlight" fill="currentColor"/></g>
</svg>
