<rect x="4.5" y="6.25" width="6" height="1.5" fill="#8a857c"/>
  <rect x="4.5" y="10.25" width="9" height="1.5" fill="#8a857c"/>
</g>
<g id="hover-center">
<rect x="4.5" y="6.25" width="6" height="1.5" fill="#e8e4dc"/>
  <rect x="4.5" y="10.25" width="9" height="1.5" fill="#e8e4dc"/>
</g>
<g id="pressed-center">
<rect x="4.5" y="6.25" width="6" height="1.5" fill="#ff9d2e"/>
  <rect x="4.5" y="10.25" width="9" height="1.5" fill="#ff9d2e"/>
</g>
<g id="inactive-center">
<rect x="4.5" y="6.25" width="6" height="1.5" fill="#565248"/>
  <rect x="4.5" y="10.25" width="9" height="1.5" fill="#565248"/>
</g>
</svg>
