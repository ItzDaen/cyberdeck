</g>
<g id="hover-center">
<rect x="4.75" y="4.75" width="8.5" height="8.5" fill="none" stroke="#e8e4dc" stroke-width="1.5"/>
</g>
<g id="pressed-center">
<rect x="4.75" y="4.75" width="8.5" height="8.5" fill="none" stroke="#ff9d2e" stroke-width="1.5"/>
</g>
<g id="inactive-center">
