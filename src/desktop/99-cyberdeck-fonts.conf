<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  CyberDeck — system font
  Installs IBM Plex Sans for text and IBM Plex Mono for numbers.

  This is the only part of the theme work that reaches the
  desktop outside Cyber*: it follows the decision taken at the
  planning stage, that "IBM Plex is the system font", so that
  native applications speak the same language as the dashboards
  and the panels.

  Note: both the colour scheme and the Plasma theme are Meridiano, so
  this file is the only part of the theme work that reaches the
  desktop outside Cyber* itself. It used to say the opposite -- that
  the scheme "stays Cyberpunk-Blue" -- which stopped being true the
  day the scheme was replaced. A comment that contradicts the
  configuration is worse than no comment.

  On priority: Plex Sans has to win over the generic Sans, so it is
  listed first in prefer_fam.
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>IBM Plex Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>IBM Plex Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>IBM Plex Mono</family>
    </prefer>
  </alias>

  <!-- The generic Sans families: they should point at Plex, not Noto. -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>DejaVu Sans</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>IBM Plex Sans</string>
    </edit>
  </match>
</fontconfig>
