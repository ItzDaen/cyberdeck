# Author: Daen
# CyberDeck Workstation Configuration v2.0
server:
  port: 8765
  # Security posture is fixed, not configurable: the backend binds
  # 127.0.0.1 only and every route but the static assets requires the
  # token. There used to be `bind_tailscale_only` and `enable_auth` keys
  # here, and nothing read them -- the code bound localhost and enforced
  # auth unconditionally. A flag that promises a switch and has no wiring
  # is worse than no flag: it lets a reader believe exposure is a config
  # edit away, in either direction. Exposure is a Caddy decision, made in
  # the Caddyfile, not here.
  # The address you reach this deck on, without the scheme. A Tailscale
  # MagicDNS name if that is how you get to it, a hostname, whatever.
  # Only used for the banner printed at startup and for the certificate
  # name; leave it empty and the banner prints the local URL instead.
  public_host: ""

# Predefined Deck Quick Buttons
deck_buttons:
  - id: "sink_browser"
    label: "Browser"
    sublabel: "Web & Media"
    icon: "globe"
    type: "sink_mute_toggle"
    target: "Browser"
    color: "#f97316"
    mute_color: "#ef4444"

  - id: "sink_anc"
    label: "ANC Headphones"
    sublabel: "Current output hardware"
    icon: "volume-2"
    type: "sink_mute_toggle"
    target: "DECK_HW"
    color: "#a855f7"
    mute_color: "#ef4444"

  - id: "sink_main"
    label: "Main Desktop"
    sublabel: "Speakers / Master"
    icon: "volume-2"
    type: "sink_mute_toggle"
    target: "Main"
    color: "#3b82f6"
    mute_color: "#ef4444"

# Whitelisted Custom Macro Commands
macros: []

